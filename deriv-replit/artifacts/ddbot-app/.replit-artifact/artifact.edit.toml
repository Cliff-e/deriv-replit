kind = "web"
previewPath = "/"
title = "DDBOt"
version = "1.0.0"
id = "artifacts/ddbot-app"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23030

[services.development]
run = "cd /home/runner/workspace/deriv-replit/artifacts/ddbot-app && npm install --legacy-peer-deps && npm run dev"

[services.production]
build = [ "sh", "-c", "cd /home/runner/workspace/deriv-replit/artifacts/ddbot-app && npm install --legacy-peer-deps && npm run build" ]
publicDir = "artifacts/ddbot-app/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23030"
BASE_PATH = "/"
